# Dependabot: updates of the Go modules, of the Deno dependencies and of the
# GitHub Actions, once a week, of releases at least 7 days old (time for a
# broken or malicious release to be found), all in one pull request.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Our own modules (goda-fi.vim, goda.vim): at once.
      exclude:
        - github.com/Shougo/*
  - package-ecosystem: deno
    directories:
      - "/"
      - "/denops/@ddu-sources/junkfile"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Our own packages: at once.
      exclude:
        - "@shougo/*"
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
